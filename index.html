<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wafiatul Khoiriah H · Portfolio</title>

    <meta name="description"
        content="Portfolio of Wafiatul Khoiriah Harahap — Quantitative Data Analyst & Business Intelligence.">

    <!-- FAVICONS (multi-platform, generated from PNG source) -->
    <link rel="icon" href="assets/favicon_io/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicon_io/site.webmanifest">
    <meta name="theme-color" content="#14b8a6">

    <meta name="api-base" content="https://simple-go-production.up.railway.app">
    <link rel="stylesheet" href="css/style.css">

    <!-- THEME BOOTSTRAP (prevents flash of wrong theme) -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem("wafi-theme");
                var prefersDark = window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches;
                var theme = stored || (prefersDark ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>

<body>

    <!-- MAIN APP WRAPPER -->
    <div class="container content-center page-stack">

        <!-- NAVBAR (HTMX LOADED) -->
        <nav
            hx-get="/components/navbar.html"
            hx-trigger="load"
            hx-swap="innerHTML">
        </nav>

        <!-- CONTENT AREA -->
        <main class="page-stack">

            <!-- LOADING STATE -->
            <div id="loading" class="hidden">
                <p class="text-meta">Loading...</p>
            </div>

            <!-- PAGE CONTENT -->
            <section id="content"
                hx-get="/pages/home.html"
                hx-trigger="load"
                hx-swap="innerHTML">
            </section>

        </main>

        <!-- FOOTER -->
        <footer>
            <p class="text-footer">
                Built with HTMX &middot; Designed &amp; maintained by Wafiatul Khoiriah H
            </p>
        </footer>

    </div>

    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
