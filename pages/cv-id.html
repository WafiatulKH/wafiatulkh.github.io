<div class="page-stack cv-page">

    <!-- ================= KONTROL CV (disembunyikan saat cetak) ================= -->
    <div class="card cv-controls no-print">

        <div class="cv-controls__row">
            <span class="cv-controls__label">Peran</span>
            <div class="cv-role-group" role="group" aria-label="Peran CV">
                <button class="button button--secondary cv-role-btn is-active" data-role="general">Umum</button>
                <button class="button button--secondary cv-role-btn" data-role="data-science">Data Science</button>
                <button class="button button--secondary cv-role-btn" data-role="teaching">Pengajaran</button>
                <button class="button button--secondary cv-role-btn" data-role="it">IT</button>
            </div>
        </div>

        <div class="cv-controls__row">
            <span class="cv-controls__label">Format</span>
            <div class="cv-format-group" role="group" aria-label="Format CV">
                <button class="button button--secondary cv-format-btn is-active" data-format="styled">Bergaya</button>
                <button class="button button--secondary cv-format-btn" data-format="ats">ATS</button>
            </div>

            <button type="button" class="button button--primary cv-print-btn" onclick="window.print()">
                Cetak / Simpan PDF
            </button>
        </div>

        <p class="text-meta cv-controls__hint">
            Tampilan bergaya untuk web. Tampilan ATS adalah tata letak satu kolom sederhana yang
            dioptimalkan untuk sistem pelacakan pelamar (ATS) — gunakan &ldquo;Cetak / Simpan
            PDF&rdquo; untuk mengekspornya.
        </p>

    </div>

    <!-- ================= DOKUMEN CV (dimuat oleh HTMX) ================= -->
    <div id="cv-document"
        class="cv-document"
        hx-get="/pages/contents/cv/styled-general.html"
        hx-trigger="load"
        hx-swap="innerHTML">
    </div>

</div>

<script>
    if (window.initCvSwitcher) window.initCvSwitcher();
</script>
